  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d074e423-dbf3-4577-951d-46b3ae881f1f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Sans 3';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"362a469c-9168-4868-b5d5-cdea9dc27c32\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #DDE2EC; }\n  @keyframes targetGlow {\n    0%,100% { box-shadow: 0 0 0 3px rgba(46,124,214,0.25), 0 0 14px rgba(46,124,214,0.35); }\n    50% { box-shadow: 0 0 0 5px rgba(46,124,214,0.40), 0 0 22px rgba(46,124,214,0.55); }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:2245px;height:1588px;background:#FFFFFF;position:relative;margin:0 auto;font-family:'Source Sans 3',sans-serif;color:#1F2430;overflow:hidden;display:flex;flex-direction:column\">\n\n  <!-- ============ TOP ACCENT ============ -->\n  <div style=\"height:7px;width:100%;background:linear-gradient(90deg,#1A1F5C 0%,#27348B 45%,#2E7CD6 100%);flex:none\"><\u002Fdiv>\n\n  <!-- ============ HEADER ============ -->\n  <div style=\"padding:16px 44px 0;flex:none\">\n    <div style=\"display:flex;align-items:center;gap:30px\">\n      <img src=\"1389cc93-b656-49d9-95a3-127fc36f7a42\" alt=\"ESI\" style=\"height:92px;width:auto;flex:none\">\n      <div style=\"flex:1;text-align:center;padding:0 8px\">\n        <div style=\"font:800 49px Montserrat,sans-serif;color:#1A1F5C;line-height:1.04;letter-spacing:-0.6px\">Scalable Architecture for Decision Support Information Systems<\u002Fdiv>\n        <div style=\"font:600 24px Montserrat,sans-serif;color:#2E7CD6;margin-top:7px\">Towards Agile Data Modeling and Integrated Predictive Analytics<\u002Fdiv>\n        <div style=\"width:130px;height:3px;background:#2E7CD6;margin:11px auto 8px;border-radius:2px\"><\u002Fdiv>\n        <div style=\"font:600 15px 'Source Sans 3',sans-serif;color:#5A6472;letter-spacing:1.2px;text-transform:uppercase\">Theoretical state of the art — literature survey &amp; comparison<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:none;background:#27348B;color:#fff;border-radius:10px;padding:12px 20px;text-align:center;box-shadow:0 3px 12px rgba(39,52,139,0.25)\">\n        <div style=\"font:800 15px Montserrat,sans-serif;letter-spacing:2px\">Master THESIS<\u002Fdiv>\n        <div style=\"font:600 12px 'Source Sans 3',sans-serif;color:#AEBBE6;margin-top:4px;letter-spacing:0.3px\">Academic year 2025 / 2026<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- author / supervisor / institution bar -->\n    <div style=\"margin-top:16px;background:#27348B;border-radius:10px;display:flex;align-items:stretch;color:#fff;overflow:hidden;box-shadow:0 3px 12px rgba(39,52,139,0.18)\">\n      <div style=\"flex:1;padding:9px 20px;text-align:center\">\n        <div style=\"font:700 10px 'Source Sans 3',sans-serif;color:#AEBBE6;letter-spacing:1.5px;text-transform:uppercase\">Author<\u002Fdiv>\n        <div style=\"font:700 15px 'Source Sans 3',sans-serif;margin-top:2px\">ABDELKEBIR Achraf<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;background:rgba(255,255,255,0.22)\"><\u002Fdiv>\n      <div style=\"flex:1;padding:9px 20px;text-align:center\">\n        <div style=\"font:700 10px 'Source Sans 3',sans-serif;color:#AEBBE6;letter-spacing:1.5px;text-transform:uppercase\">Supervisor<\u002Fdiv>\n        <div style=\"font:700 15px 'Source Sans 3',sans-serif;margin-top:2px\">Mr. ABBAS Mohamed Amir <span style=\"font-weight:400;color:#AEBBE6\">(ESI)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px;background:rgba(255,255,255,0.22)\"><\u002Fdiv>\n      <div style=\"flex:1.5;padding:9px 20px;text-align:center\">\n        <div style=\"font:700 10px 'Source Sans 3',sans-serif;color:#AEBBE6;letter-spacing:1.5px;text-transform:uppercase\">Institution<\u002Fdiv>\n        <div style=\"font:700 15px 'Source Sans 3',sans-serif;margin-top:2px\">ESI — École nationale Supérieure d'Informatique, Algiers<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- keywords -->\n    <div style=\"margin-top:9px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center\">\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">Data Vault 2.0<\u002Fspan>\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">Lakehouse<\u002Fspan>\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">Decision support system<\u002Fspan>\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">Structural scalability<\u002Fspan>\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">Analytical scalability<\u002Fspan>\n      <span style=\"background:#EAEEF7;color:#27348B;font:600 12px 'Source Sans 3',sans-serif;padding:5px 13px;border-radius:20px\">State of the art<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ COLUMNS ============ -->\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:11px 44px 10px;min-height:0\">\n\n    <!-- ============================ COLUMN 1 ============================ -->\n    <div style=\"display:flex;flex-direction:column;gap:14px;justify-content:space-between\">\n\n      <!-- 01 Context & Problem -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#27348B;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#27348B;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">01<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Context &amp; Problem<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:15px 16px\">\n          \n          <div style=\"font:400 14px 'Source Sans 3',sans-serif;line-height:1.5;color:#1F2430\">For three decades the <b style=\"color: rgb(39, 52, 139);\">data warehouse<\u002Fb> has been the core of decision support — built for a stable world: fixed sources, a schema decided in advance, reporting on the past. <b>Two shifts broke that assumption:<\u002Fb><\u002Fdiv><div style=\"margin-top:13px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;gap:9px;background:#F4F6FB;border-radius:8px;padding:9px 11px\">\n              <div style=\"width:7px;height:7px;border-radius:50%;background:#2E7CD6;margin-top:5px;flex:none\"><\u002Fdiv>\n              <div style=\"font:400 13px 'Source Sans 3',sans-serif;line-height:1.4\"><b style=\"color: rgb(39, 52, 139);\">Data shift<\u002Fb> — The number and variety of data sources have grown. Transactional systems, streaming feeds, change-data-capture, and semi-structured data now arrive together. A fixed schema becomes a problem.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;background:#F4F6FB;border-radius:8px;padding:9px 11px\">\n              <div style=\"width:7px;height:7px;border-radius:50%;background:#2E7CD6;margin-top:5px;flex:none\"><\u002Fdiv>\n              <div style=\"font:400 13px 'Source Sans 3',sans-serif;line-height:1.4\"><b style=\"color: rgb(39, 52, 139);\">Demand shift<\u002Fb> — Analytics has moved from explaining what happened toward predicting what will happen and advising what to do. Most organizations still only describe the past, but the demand for prediction keeps rising.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:11px;font:600 12px 'Source Sans 3',sans-serif;color:#5A6472\">Two distinct properties — studied separately in the literature:<\u002Fdiv>\n          <div style=\"margin-top:7px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"border-left:3px solid #27348B;padding:4px 0 4px 9px;font:400 12.5px 'Source Sans 3',sans-serif\"><b style=\"color:#27348B\">Structural scalability<\u002Fb> — absorb new sources &amp; schema change without re-engineering.<\u002Fdiv>\n            <div style=\"border-left:3px solid #2E7CD6;padding:4px 0 4px 9px;font:400 12.5px 'Source Sans 3',sans-serif\"><b style=\"color: rgb(46, 124, 214);\">Analytical scalability<\u002Fb> — support ever more advanced analytics.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;background:#EAEEF7;border-left:4px solid #E8A13A;border-radius:0 8px 8px 0;padding:12px 14px\">\n            <div style=\"font:700 11px Montserrat,sans-serif;color:#B7791F;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px\">The gap<\u002Fdiv>\n            <div style=\"font:400 12.5px 'Source Sans 3',sans-serif;line-height:1.4;color:#1F2430\">No single study compares architectures on <b>both<\u002Fb> axes and asks what already exists where they meet.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 02 Objectives -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#27348B;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#27348B;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">02<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Objectives<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:15px 16px;display:flex;flex-direction:column;gap:13px\">\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:#27348B;color:#fff;font:800 13px Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">1<\u002Fdiv>\n            <div style=\"font:400 13px 'Source Sans 3',sans-serif;line-height:1.4\">Survey warehouse <b>modeling approaches<\u002Fb>; compare on <b style=\"color:#27348B\">structural scalability<\u002Fb> → which best absorbs source &amp; schema change.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:#27348B;color:#fff;font:800 13px Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">2<\u002Fdiv>\n            <div style=\"font:400 13px 'Source Sans 3',sans-serif;line-height:1.4\">Survey modern <b>analytical architectures<\u002Fb>; compare on <b style=\"color:#2E7CD6\">analytical scalability<\u002Fb> → which best supports the full analytics spectrum.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:#27348B;color:#fff;font:800 13px Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;flex:none\">3<\u002Fdiv>\n            <div style=\"font:400 13px 'Source Sans 3',sans-serif;line-height:1.4\">Review what the literature reports at the <b>intersection<\u002Fb> — architectures addressing both at once — and where it stands today.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:3px;border-top:1px dashed #C9CFDA;padding-top:8px;font:italic 400 11.5px 'Source Sans 3',sans-serif;color:#5A6472;line-height:1.4\">Every conclusion traces to a cited source; vendor sources are flagged and weighed accordingly. <b style=\"font-style:normal;color:#27348B\">This thesis surveys and compares — it proposes no new architecture.<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 03 Methodology -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#27348B;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#27348B;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">03<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Methodology<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:15px 16px\">\n          <!-- flow: 3 tiers -> criteria gate -> verdict -->\n          <div style=\"display:flex;align-items:center;gap:7px\">\n            <div style=\"display:flex;flex-direction:column;gap:5px;flex:1.3\">\n              <div style=\"background:#27348B;color:#fff;border-radius:6px;padding:6px 8px;text-align:center\"><div style=\"font:700 11px Montserrat,sans-serif\">Foundational<\u002Fdiv><div style=\"font:400 9px 'Source Sans 3',sans-serif;color:#C7D0EC\">Inmon · Kimball · Linstedt<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#2E7CD6;color:#fff;border-radius:6px;padding:6px 8px;text-align:center\"><div style=\"font:700 11px Montserrat,sans-serif\">Current<\u002Fdiv><div style=\"font:400 9px 'Source Sans 3',sans-serif;color:#DCE9F8\">Peer-reviewed 2020–26<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#FBE3C0;color:#8a5a12;border:1px solid #E8A13A;border-radius:6px;padding:6px 8px;text-align:center\"><div style=\"font:700 11px Montserrat,sans-serif\">Industry / vendor<\u002Fdiv><div style=\"font:400 9px 'Source Sans 3',sans-serif;color:#9a6c20\">flagged · not peer-reviewed<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:700 16px Montserrat;color:#2E7CD6;flex:none\">→<\u002Fdiv>\n            <div style=\"flex:none;background:#EAEEF7;border:1.5px solid #27348B;border-radius:8px;padding:8px 7px;text-align:center;width:62px\"><div style=\"font:700 11px Montserrat,sans-serif;color:#27348B;line-height:1.1\">Explicit criteria<\u002Fdiv><div style=\"font:400 9px 'Source Sans 3',sans-serif;color:#5A6472;margin-top:2px\">per axis<\u002Fdiv><\u002Fdiv>\n            <div style=\"font:700 16px Montserrat;color:#2E7CD6;flex:none\">→<\u002Fdiv>\n            <div style=\"flex:none;background:#1F9D57;color:#fff;border-radius:8px;padding:8px 9px;text-align:center;width:84px\"><div style=\"font:700 11px Montserrat,sans-serif;line-height:1.15\">Comparison &amp; verdict<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:15px;display:flex;flex-direction:column;gap:7px\">\n            <div style=\"font:400 12.5px 'Source Sans 3',sans-serif;line-height:1.4\"><b style=\"color:#27348B\">Type<\u002Fb> — theoretical state-of-the-art study; no prototype, no experiment.<\u002Fdiv>\n            <div style=\"font:400 12.5px 'Source Sans 3',sans-serif;line-height:1.4\"><b style=\"color:#27348B\">Method<\u002Fb> — narrative, semi-systematic literature review.<\u002Fdiv>\n            <div style=\"font:400 12.5px 'Source Sans 3',sans-serif;line-height:1.4\">Comparison runs against explicit criteria → conclusions are <b>assessments, not opinions<\u002Fb>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- ============================ COLUMN 2 ============================ -->\n    <div style=\"display:flex;flex-direction:column;gap:14px;justify-content:space-between\">\n\n      <!-- 04 Two Axes (KEY FIGURE) -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#2E7CD6;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#2E7CD6;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">04<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Two Axes of Scalability<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 14px\">\n          <div style=\"font:700 11px Montserrat,sans-serif;color:#27348B;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;text-align:center\">Fig — Positioning map<\u002Fdiv>\n          <!-- 2x2 map -->\n          <div style=\"display:flex;gap:6px\">\n            <div style=\"writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;letter-spacing:0.5px;padding:6px 0\">Structural scalability →<\u002Fdiv>\n            <div style=\"flex:1\">\n              <div style=\"position:relative;height:218px;border-left:2px solid #5A6472;border-bottom:2px solid #5A6472;background:linear-gradient(135deg,#F4F6FB 0%,#EAEEF7 100%)\">\n                <!-- quadrant guides -->\n                <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(90,100,114,0.18)\"><\u002Fdiv>\n                <div style=\"position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(90,100,114,0.18)\"><\u002Fdiv>\n                <!-- markers -->\n                <div style=\"position:absolute;left:22%;top:80%;transform:translate(-50%,-50%);background:#9AA0AE;color:#fff;border-radius:7px;padding:5px 8px;text-align:center;width:92px;box-shadow:0 2px 6px rgba(0,0,0,0.12)\"><div style=\"font:700 10px Montserrat,sans-serif\">Classical DW<\u002Fdiv><div style=\"font:400 8.5px 'Source Sans 3',sans-serif\">Inmon / Kimball<\u002Fdiv><\u002Fdiv>\n                <div style=\"position:absolute;left:22%;top:20%;transform:translate(-50%,-50%);background:#27348B;color:#fff;border-radius:7px;padding:5px 8px;text-align:center;width:92px;box-shadow:0 2px 6px rgba(39,52,139,0.3)\"><div style=\"font:700 10px Montserrat,sans-serif\">Data Vault 2.0<\u002Fdiv><div style=\"font:400 8.5px 'Source Sans 3',sans-serif;color:#C7D0EC\">high structural<\u002Fdiv><\u002Fdiv>\n                <div style=\"position:absolute;left:78%;top:80%;transform:translate(-50%,-50%);background:#2E8B57;color:#fff;border-radius:7px;padding:5px 8px;text-align:center;width:92px;box-shadow:0 2px 6px rgba(46,139,87,0.3)\"><div style=\"font:700 10px Montserrat,sans-serif\">Lakehouse / Delta<\u002Fdiv><div style=\"font:400 8.5px 'Source Sans 3',sans-serif;color:#CDEBD9\">high analytical<\u002Fdiv><\u002Fdiv>\n                <div style=\"position:absolute;left:78%;top:20%;transform:translate(-50%,-50%);background:#fff;color:#27348B;border:2px dashed #2E7CD6;border-radius:7px;padding:5px 8px;text-align:center;width:100px;animation:targetGlow 2.4s ease-in-out infinite\"><div style=\"font:700 10px Montserrat,sans-serif\">DV2.0 on Lakehouse<\u002Fdiv><div style=\"font:600 8.5px 'Source Sans 3',sans-serif;color:#2E7CD6\">⌖ open frontier<\u002Fdiv><\u002Fdiv>\n                <div style=\"position:absolute;left:6px;top:4px;font:600 9px 'Source Sans 3',sans-serif;color:#9AA0AE\">high ↑<\u002Fdiv>\n                <div style=\"position:absolute;left:6px;bottom:4px;font:600 9px 'Source Sans 3',sans-serif;color:#9AA0AE\">low<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:700 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;letter-spacing:0.5px;margin-top:4px\">Analytical scalability →<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:italic 600 11px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:7px;line-height:1.35\">\"The field answers each axis well; their combination is the open frontier.\"<\u002Fdiv>\n          <div style=\"margin-top:9px;font:400 12px 'Source Sans 3',sans-serif;color:#1F2430;line-height:1.4;border-top:1px solid #EAEEF7;padding-top:8px\">Two <b>independent<\u002Fb> properties — and the thesis maps the field on both: absorbing change (structural) vs. climbing the analytics maturity spectrum with ML <b>built into<\u002Fb> the pipeline (analytical).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 05 Structural Scalability (criteria + Inmon + Kimball) -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#27348B;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#27348B;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">05<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Structural Scalability<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 14px\">\n          <div style=\"background:#EAEEF7;border-radius:7px;padding:7px 11px;font:700 13px Montserrat,sans-serif;color:#27348B;text-align:center\">Guiding question: \"Which model best absorbs change?\"<\u002Fdiv>\n          <div style=\"font:700 11px Montserrat,sans-serif;color:#5A6472;text-transform:uppercase;letter-spacing:0.6px;margin:11px 0 7px\">Five criteria<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color: rgb(39, 52, 139);\">Source integration<\u002Fb> — ability of absorbing a new, heterogeneous source.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#27348B\">Schema evolution<\u002Fb> — cost &amp; reach of a structural change; additive vs destructive.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#27348B\">Volume / throughput<\u002Fb> — scale data &amp; load without redesigning the model.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#27348B\">Historization &amp; auditability<\u002Fb> — completeness &amp; non-destructiveness of history.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#27348B\">Change-propagation coupling<\u002Fb> — how well consumers are shielded from change.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Inmon -->\n          <div style=\"margin-top:12px;border:1px solid #E7EBF5;border-radius:8px;overflow:hidden\">\n            <div style=\"background:#F4F6FB;padding:7px 10px;font:700 12.5px Montserrat,sans-serif;color:#27348B;border-bottom:1px solid #E7EBF5\">Inmon — Corporate Information Factory<\u002Fdiv>\n            <div style=\"padding:9px 10px\">\n              <!-- FIG-INMON -->\n              <div style=\"display:flex;align-items:center;gap:4px;justify-content:center\">\n                <div style=\"background:#EAEEF7;border:1px solid #C9CFDA;border-radius:5px;padding:5px 6px;font:600 9.5px 'Source Sans 3',sans-serif;text-align:center;color:#5A6472\">Source<br>systems<\u002Fdiv>\n                <span style=\"color:#2E7CD6;font:700 13px Montserrat\">→<\u002Fspan>\n                <div style=\"background:#EAEEF7;border:1px solid #C9CFDA;border-radius:5px;padding:5px 6px;font:600 9.5px 'Source Sans 3',sans-serif;text-align:center;color:#5A6472\">Staging<\u002Fdiv>\n                <span style=\"color:#2E7CD6;font:700 13px Montserrat\">→<\u002Fspan>\n                <div style=\"background:#27348B;color:#fff;border-radius:5px;padding:6px 7px;font:700 10px Montserrat,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(39,52,139,0.3)\">3NF<br>enterprise<br>core<\u002Fdiv>\n                <span style=\"color:#2E7CD6;font:700 13px Montserrat\">→<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:3px\">\n                  <div style=\"background:#DCE9F8;border-radius:4px;padding:3px 6px;font:600 9px 'Source Sans 3',sans-serif;color:#27348B\">Mart<\u002Fdiv>\n                  <div style=\"background:#DCE9F8;border-radius:4px;padding:3px 6px;font:600 9px 'Source Sans 3',sans-serif;color:#27348B\">Mart<\u002Fdiv>\n                  <div style=\"background:#DCE9F8;border-radius:4px;padding:3px 6px;font:600 9px 'Source Sans 3',sans-serif;color:#27348B\">Mart<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"color:#2E7CD6;font:700 13px Montserrat\">→<\u002Fspan>\n                <div style=\"background:#2E7CD6;color:#fff;border-radius:5px;padding:5px 6px;font:700 9.5px Montserrat,sans-serif;text-align:center\">BI<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:italic 600 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:6px\">\"One normalized core — consistent, but change ripples outward.\"<\u002Fdiv>\n              <div style=\"margin-top:6px;display:flex;gap:8px;font:400 11px 'Source Sans 3',sans-serif;line-height:1.32\">\n                <div style=\"flex:1\"><b style=\"color:#1F9D57\">Strength<\u002Fb> integration &amp; enterprise consistency.<\u002Fdiv>\n                <div style=\"flex:1\"><b style=\"color:#C0556B\">Weakness<\u002Fb> change ripples through the core — slow to deliver value.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Kimball -->\n          <div style=\"margin-top:10px;border:1px solid #E7EBF5;border-radius:8px;overflow:hidden\">\n            <div style=\"background:#F4F6FB;padding:7px 10px;font:700 12.5px Montserrat,sans-serif;color:#27348B;border-bottom:1px solid #E7EBF5\">Kimball — Dimensional model<\u002Fdiv>\n            <div style=\"padding:9px 10px\">\n              <!-- FIG-STAR -->\n              <div style=\"position:relative;height:148px\">\n                <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84%;height:1px;background:#C9CFDA\"><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:14px;bottom:14px;transform:translateX(-50%);width:1px;background:#C9CFDA\"><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#27348B;color:#fff;border-radius:6px;padding:7px 9px;text-align:center;box-shadow:0 2px 6px rgba(39,52,139,0.3)\"><div style=\"font:700 10px Montserrat,sans-serif\">FACT_SALES<\u002Fdiv><div style=\"font:400 8px 'Source Sans 3',sans-serif;color:#C7D0EC\">keys + measures<\u002Fdiv><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:2px;transform:translateX(-50%);background:#DCE9F8;color:#27348B;border:1px solid #9FC0EA;border-radius:5px;padding:4px 7px;font:600 9.5px 'Source Sans 3',sans-serif\">DIM_DATE<\u002Fdiv>\n                <div style=\"position:absolute;left:50%;bottom:2px;transform:translateX(-50%);background:#DCE9F8;color:#27348B;border:1px solid #9FC0EA;border-radius:5px;padding:4px 7px;font:600 9.5px 'Source Sans 3',sans-serif\">DIM_STORE<\u002Fdiv>\n                <div style=\"position:absolute;left:0;top:50%;transform:translateY(-50%);background:#DCE9F8;color:#27348B;border:1px solid #9FC0EA;border-radius:5px;padding:4px 7px;font:600 9.5px 'Source Sans 3',sans-serif\">DIM_CUSTOMER<\u002Fdiv>\n                <div style=\"position:absolute;right:0;top:50%;transform:translateY(-50%);background:#DCE9F8;color:#27348B;border:1px solid #9FC0EA;border-radius:5px;padding:4px 7px;font:600 9.5px 'Source Sans 3',sans-serif\">DIM_PRODUCT<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:italic 600 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:4px\">\"Query-friendly stars; shared dimensions are hard to change.\"<\u002Fdiv>\n              <div style=\"margin-top:6px;display:flex;gap:8px;font:400 11px 'Source Sans 3',sans-serif;line-height:1.32\">\n                <div style=\"flex:1\"><b style=\"color:#1F9D57\">Strength<\u002Fb> query simplicity, fast delivery.<\u002Fdiv>\n                <div style=\"flex:1\"><b style=\"color:#C0556B\">Weakness<\u002Fb> shared dims ripple across reports; only planned history kept.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- ============================ COLUMN 3 ============================ -->\n    <div style=\"display:flex;flex-direction:column;gap:14px;justify-content:space-between\">\n\n      <!-- 05 cont — Data Vault + table + verdict -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#27348B;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#27348B;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">05<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Structural Scalability <span style=\"font:400 11px 'Source Sans 3';color:#AEBBE6\">cont.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 14px\">\n          <!-- Data Vault 2.0 -->\n          <div style=\"border:1.5px solid #27348B;border-radius:8px;overflow:hidden\">\n            <div style=\"background:#27348B;padding:7px 10px;font:700 12.5px Montserrat,sans-serif;color:#fff\">Data Vault 2.0 <span style=\"font:400 10px 'Source Sans 3';color:#C7D0EC\">— the structural reference<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:10px\">\n              <!-- FIG-DV2 -->\n              <div style=\"background:#F4F6FB;border-radius:7px;padding:10px 8px\">\n                <div style=\"display:flex;align-items:center;justify-content:center;gap:5px\">\n                  <div style=\"background:#27348B;color:#fff;border-radius:5px;padding:6px 8px;font:700 9.5px Montserrat,sans-serif;text-align:center\">HUB_<br>CUSTOMER<\u002Fdiv>\n                  <div style=\"height:2px;width:14px;background:#9AA0AE\"><\u002Fdiv>\n                  <div style=\"background:#2E8B57;color:#fff;border-radius:5px;padding:6px 8px;font:700 9.5px Montserrat,sans-serif;text-align:center\">LNK_CUST_<br>ORDER<\u002Fdiv>\n                  <div style=\"height:2px;width:14px;background:#9AA0AE\"><\u002Fdiv>\n                  <div style=\"background:#27348B;color:#fff;border-radius:5px;padding:6px 8px;font:700 9.5px Montserrat,sans-serif;text-align:center\">HUB_<br>ORDER<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px;margin:3px 0\">\n                  <div style=\"flex:1;text-align:center;font:700 12px Montserrat;color:#9AA0AE\">↓<\u002Fdiv>\n                  <div style=\"flex:1;text-align:center;font:700 12px Montserrat;color:#9AA0AE\">↓<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;gap:6px\">\n                  <div style=\"background:#FBE3C0;border:1px solid #E8A13A;border-radius:5px;padding:4px 6px;font:600 8px 'Source Sans 3',sans-serif;color:#8a5a12;flex:1;text-align:center\"><b>SAT_CUSTOMER<\u002Fb><br>name · address · phone<br><i>historized<\u002Fi><\u002Fdiv>\n                  <div style=\"background:#FBE3C0;border:1px solid #E8A13A;border-radius:5px;padding:4px 6px;font:600 8px 'Source Sans 3',sans-serif;color:#8a5a12;flex:1;text-align:center\"><b>SAT_ORDER<\u002Fb><br>date · status · amount<br><i>historized<\u002Fi><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;justify-content:center;margin-top:8px;flex-wrap:wrap;font:600 8.5px 'Source Sans 3',sans-serif;color:#5A6472\">\n                  <span><span style=\"display:inline-block;width:8px;height:8px;background:#27348B;border-radius:2px;vertical-align:middle\"><\u002Fspan> Hub = business key<\u002Fspan>\n                  <span><span style=\"display:inline-block;width:8px;height:8px;background:#2E8B57;border-radius:2px;vertical-align:middle\"><\u002Fspan> Link = relationship<\u002Fspan>\n                  <span><span style=\"display:inline-block;width:8px;height:8px;background:#FBE3C0;border:1px solid #E8A13A;border-radius:2px;vertical-align:middle\"><\u002Fspan> Satellite = context<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:italic 600 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:6px\">\"Keys, relationships and context separated — new data is added, never altered.\"<\u002Fdiv>\n              <div style=\"margin-top:7px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.38\">Splits each entity into <b>Hub / Link / Satellite<\u002Fb>; Raw + Business Vault; insert-only, hash keys. Change is <b style=\"color:#1F9D57\">additive, not destructive<\u002Fb>. <b style=\"color:#C0556B\">Cost:<\u002Fb> join-heavy queries &amp; complexity — on query/build effort, not structure.<\u002Fdiv>\n              <div style=\"margin-top:6px;font:italic 400 10.5px 'Source Sans 3',sans-serif;color:#5A6472\">No Anchor modeling: same additive profile, but heavier — no distinct verdict.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- comparison table -->\n          <table style=\"width:100%;border-collapse:collapse;margin-top:12px;font-family:'Source Sans 3',sans-serif\">\n            <thead>\n              <tr style=\"background:#27348B;color:#fff\">\n                <th style=\"text-align:left;padding:6px 8px;font:700 10.5px Montserrat,sans-serif\">Criterion<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Inmon<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Kimball<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Data Vault 2.0<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody style=\"font:600 10px 'Source Sans 3',sans-serif;color:#fff;text-align:center\">\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#fff\">Source integration<\u002Ftd>\n                <td style=\"background:#E8A13A;padding:5px\">Partial<\u002Ftd><td style=\"background:#E8A13A;padding:5px\">Partial<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#EAEEF7\">Schema evolution<\u002Ftd>\n                <td style=\"background:#C0556B;padding:5px\">Weak<\u002Ftd><td style=\"background:#C0556B;padding:5px\">Weak<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#fff\">Volume / throughput<\u002Ftd>\n                <td style=\"background:# isplay:flex;gap:6px;margin-top:4px\">\n                <div style=\"flex:1;text-align:center;font:italic 400 8.5px 'Source Sans 3';color:#5A6472\">what happened?<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:italic 400 8.5px 'Source Sans 3';color:#5A6472\">why?<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:italic 400 8.5px 'Source Sans 3';color:#2E7CD6\">what will happen?<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:italic 400 8.5px 'Source Sans 3';color:#27348B\">what to do?<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- requirement tags -->\n              <div style=\"display:flex;gap:6px;margin-top:4px\">\n                <div style=\"flex:1;text-align:center;font:600 7.5px 'Source Sans 3';color:#5A6472;background:#F4F6FB;border-radius:4px;padding:3px 2px\">DW + OLAP<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:600 7.5px 'Source Sans 3';color:#5A6472;background:#F4F6FB;border-radius:4px;padding:3px 2px\">DW + OLAP<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:600 7.5px 'Source Sans 3';color:#27348B;background:#DCE9F8;border-radius:4px;padding:3px 2px\">ML + feature pipelines<\u002Fdiv>\n                <div style=\"flex:1;text-align:center;font:600 7.5px 'Source Sans 3';color:#27348B;background:#DCE9F8;border-radius:4px;padding:3px 2px\">Closed-loop + governance<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- stall bracket -->\n              <div style=\"width:50%;margin-top:5px;border-top:2px solid #E8A13A;border-left:2px solid #E8A13A;border-right:2px solid #E8A13A;height:8px;border-radius:4px 4px 0 0\"><\u002Fdiv>\n              <div style=\"width:50%;text-align:center;font:700 8px 'Source Sans 3';color:#B7791F;margin-top:2px\">where most organizations stall<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:italic 600 11px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:8px;line-height:1.35\">\"The jump to prediction needs a new pipeline shape, not a harder query.\"<\u002Fdiv>\n\n          <div style=\"font:700 11px Montserrat,sans-serif;color:#5A6472;text-transform:uppercase;letter-spacing:0.6px;margin:11px 0 7px\">Five criteria<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#2E7CD6\">Maturity reach<\u002Fb> — highest analytics level supported natively.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color: rgb(46, 124, 214);\">Native model integration<\u002Fb> — Are ML models part of the system, or stuck outside?<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#2E7CD6\">Data readiness<\u002Fb> — freshness, trust &amp; feature availability at use.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#2E7CD6\">Workload plurality<\u002Fb> — serve BI <b>and<\u002Fb> ML from one governed layer.<\u002Fdiv>\n            <div style=\"background:#F4F6FB;border-radius:6px;padding:5px 9px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.32\"><b style=\"color:#2E7CD6\">Lifecycle support<\u002Fb> — retraining, feedback &amp; model governance in-pipeline.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- ============================ COLUMN 4 ============================ -->\n    <div style=\"display:flex;flex-direction:column;gap:11px;justify-content:space-between\">\n\n      <!-- 06 cont — Lake / Lakehouse + table + verdict -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#2E7CD6;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#2E7CD6;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">06<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Analytical Scalability <span style=\"font:400 11px 'Source Sans 3';color:#D6E7F9\">cont.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:10px 14px\">\n          <!-- Data Lake -->\n          <div style=\"border:1px solid #E7EBF5;border-radius:8px;overflow:hidden\">\n            <div style=\"background:#F4F6FB;padding:6px 10px;font:700 12.5px Montserrat,sans-serif;color:#27348B;border-bottom:1px solid #E7EBF5\">Data Lake<\u002Fdiv>\n            <div style=\"padding:7px 10px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.36\">A cheap place to dump raw data of any shape (<b>\"schema-on-read\"<\u002Fb>).<br><b style=\"color: rgb(31, 157, 87);\">Strength<\u002Fb> great for ML (data scientists love raw data); cheap; flexible.&nbsp;<div><b style=\"color: rgb(192, 85, 107);\">Weakness<\u002Fb> no rules — no quality checks, no clear meaning, no transactions. It becomes a <b>\"data swamp\"<\u002Fb>: full of files nobody trusts.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- Lakehouse / Delta -->\n          <div style=\"margin-top:8px;border:1.5px solid #2E8B57;border-radius:8px;overflow:hidden\">\n            <div style=\"background:#2E8B57;padding:6px 10px;font:700 12.5px Montserrat,sans-serif;color:#fff\">Lakehouse / Delta <span style=\"font:400 10px 'Source Sans 3';color:#CDEBD9\">— the analytical reference<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:7px 10px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.4\">\n              Combines the good of the lake (cheap, open, flexible) with the good of the warehouse (reliable, trusted, organized). It adds a <b>transaction log<\u002Fb> on top of the files. This gives:\n              <ul style=\"margin:5px 0 0;padding-left:16px\">\n                <li style=\"margin-bottom:3px\"><b style=\"color:#2E8B57\">Schema enforcement<\u002Fb> — bad/wrong files get rejected (no more swamp).<\u002Fli>\n                <li style=\"margin-bottom:3px\"><b style=\"color:#2E8B57\">Schema evolution<\u002Fb> — structure changes safely over time.<\u002Fli>\n                <li style=\"margin-bottom:3px\"><b style=\"color:#2E8B57\">Time travel<\u002Fb> — keeping an ordered record of every change ever made to a table.<\u002Fli>\n              <\u002Ful>\n              <div style=\"margin-top:5px\"><b>Result:<\u002Fb> one trusted place serves both BI reports and ML training.&nbsp;<div>This is the architecture that reaches all four analytics levels.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- FIG-MEDALLION -->\n          <div style=\"margin-top:7px;background:#F4F6FB;border-radius:8px;padding:6px 10px\">\n            <div style=\"font:700 10px Montserrat,sans-serif;color:#27348B;margin-bottom:5px\">Delta = the medallion pattern<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:3px;justify-content:center\">\n              <div style=\"background:#EAEEF7;border:1px solid #C9CFDA;border-radius:5px;padding:6px 5px;font:600 8.5px 'Source Sans 3';color:#5A6472;text-align:center\">Sources<\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat\">→<\u002Fspan>\n              <div style=\"background:#CD7F32;color:#fff;border-radius:5px;padding:6px 7px;font:700 9px Montserrat,sans-serif;text-align:center\">Bronze<br><span style=\"font:400 7.5px 'Source Sans 3'\">raw<\u002Fspan><\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat\">→<\u002Fspan>\n              <div style=\"background:#9AA0AE;color:#fff;border-radius:5px;padding:6px 7px;font:700 9px Montserrat,sans-serif;text-align:center\">Silver<br><span style=\"font:400 7.5px 'Source Sans 3'\">cleansed<\u002Fspan><\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat\">→<\u002Fspan>\n              <div style=\"background:#D4AF37;color:#fff;border-radius:5px;padding:6px 7px;font:700 9px Montserrat,sans-serif;text-align:center\">Gold<br><span style=\"font:400 7.5px 'Source Sans 3'\">business<\u002Fspan><\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat\">→<\u002Fspan>\n              <div style=\"background:#27348B;color:#fff;border-radius:5px;padding:6px 6px;font:700 9px Montserrat,sans-serif;text-align:center\">BI +<br>ML<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- comparison table -->\n          <table style=\"width:100%;border-collapse:collapse;margin-top:8px;font-family:'Source Sans 3',sans-serif\">\n            <thead>\n              <tr style=\"background:#2E7CD6;color:#fff\">\n                <th style=\"text-align:left;padding:6px 8px;font:700 10.5px Montserrat,sans-serif\">Criterion<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Data Lake<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Lakehouse<\u002Fth>\n                <th style=\"padding:6px 4px;font:700 10.5px Montserrat,sans-serif\">Delta<\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody style=\"font:600 10px 'Source Sans 3',sans-serif;color:#fff;text-align:center\">\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#fff\">Maturity reach<\u002Ftd>\n                <td style=\"background:#E8A13A;padding:5px\">Partial<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#EAEEF7\">Native model integration<\u002Ftd>\n                <td style=\"background:#E8A13A;padding:5px\">Partial<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#fff\">Data readiness<\u002Ftd>\n                <td style=\"background:#C0556B;padding:5px\">Weak<\u002Ftd><td style=\"background:#E8A13A;padding:5px\">Partial<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#EAEEF7\">Workload plurality<\u002Ftd>\n                <td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n              <tr>\n                <td style=\"text-align:left;padding:5px 8px;color:#1F2430;font-weight:600;background:#fff\">Lifecycle support<\u002Ftd>\n                <td style=\"background:#C0556B;padding:5px\">Weak<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd><td style=\"background:#1F9D57;padding:5px\">Strong<\u002Ftd>\n              <\u002Ftr>\n            <\u002Ftbody>\n          <\u002Ftable>\n\n          <!-- verdict ribbon -->\n          <div style=\"margin-top:8px;background:linear-gradient(90deg,#1F9D57 0%,#168047 100%);border-radius:9px;padding:8px 13px;color:#fff;box-shadow:0 3px 12px rgba(31,157,87,0.3);display:flex;gap:10px;align-items:flex-start\">\n            <div style=\"font-size:22px;line-height:1;flex:none\">🏆<\u002Fdiv>\n            <div><div style=\"font:800 13px Montserrat,sans-serif;letter-spacing:0.3px\">Verdict — Lakehouse / Delta<\u002Fdiv><div style=\"font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.38;margin-top:2px;color:#E6F6EC\">The only approach Strong across maturity reach, native integration, workload plurality &amp; lifecycle support — the full spectrum on one governed store.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 07 Dual Scalability -->\n      <div style=\"background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(26,31,92,0.08);border:1px solid #E7EBF5;overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#1A1F5C;padding:9px 13px\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#1A1F5C;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">07<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Dual Scalability<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 14px\">\n          <div style=\"font:700 13px Montserrat,sans-serif;color:#27348B;margin-bottom:5px\">Data Vault 2.0 on the Lakehouse — complementary strengths<\u002Fdiv>\n          <!-- FIG-DUAL -->\n          <div style=\"background:#F4F6FB;border-radius:8px;padding:6px 8px\">\n            <div style=\"display:flex;align-items:stretch;gap:3px;justify-content:center\">\n              <div style=\"display:flex;flex-direction:column;gap:3px;align-items:center\">\n                <div style=\"background:#EAEEF7;border:1px solid #C9CFDA;border-radius:5px;padding:5px;font:600 8.5px 'Source Sans 3';color:#5A6472;text-align:center;width:54px;min-height:34px;display:flex;align-items:center;justify-content:center\">Staging<\u002Fdiv>\n                <div style=\"background:#CD7F32;color:#fff;border-radius:5px;padding:5px;font:700 9px Montserrat;width:54px;text-align:center\">Bronze<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat;align-self:center\">→<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:3px;align-items:center\">\n                <div style=\"background:#27348B;color:#fff;border-radius:5px;padding:5px;font:600 8px 'Source Sans 3';text-align:center;width:78px;min-height:34px;display:flex;align-items:center;justify-content:center\"><span>Raw + Business Vault <span style=\"color:#C7D0EC\">(hubs·links·sats)<\u002Fspan><\u002Fspan><\u002Fdiv>\n                <div style=\"background:#9AA0AE;color:#fff;border-radius:5px;padding:5px;font:700 9px Montserrat;width:78px;text-align:center\">Silver<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat;align-self:center\">→<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:3px;align-items:center\">\n                <div style=\"background:#DCE9F8;color:#27348B;border-radius:5px;padding:5px;font:600 8.5px 'Source Sans 3';text-align:center;width:60px;min-height:34px;display:flex;align-items:center;justify-content:center\">Star-schema marts<\u002Fdiv>\n                <div style=\"background:#D4AF37;color:#fff;border-radius:5px;padding:5px;font:700 9px Montserrat;width:60px;text-align:center\">Gold<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"color:#2E7CD6;font:700 12px Montserrat;align-self:center\">→<\u002Fspan>\n              <div style=\"background:#1A1F5C;color:#fff;border-radius:5px;padding:5px 6px;font:700 9px Montserrat;text-align:center;align-self:center\">BI +<br>ML<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:italic 600 10px 'Source Sans 3',sans-serif;color:#5A6472;text-align:center;margin-top:7px\">\"Data Vault hosted inside the open store.\"<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:6px;font:400 11.5px 'Source Sans 3',sans-serif;line-height:1.34\">DV2.0 brings the trustworthy history, stable keys &amp; lineage the Lakehouse lacks;<div>the Lakehouse brings the <b>open storage &amp; built-in ML loop<\u002Fb> DV2.0 can't reach — the vault lives <b>inside<\u002Fb> the open store, fully governed.<\u002Fdiv><\u002Fdiv>\n          <div style=\"margin-top:7px;background:#FBE3C0;border-left:4px solid #E8A13A;border-radius:0 8px 8px 0;padding:7px 11px\">\n            <div style=\"font:700 10.5px 'Source Sans 3',sans-serif;color:#8a5a12;line-height:1.34\"><span style=\"font-size:13px\">⚠<\u002Fspan> <b>The gap:<\u002Fb> documented in <b>industry<\u002Fb> sources, barely studied in peer-reviewed research; its trade-offs (join cost, double history, skills) are noted but <b>not measured<\u002Fb>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 08 Conclusion -->\n      <div style=\"background:#1A1F5C;border-radius:11px;box-shadow:0 4px 16px rgba(26,31,92,0.18);overflow:hidden\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:8px 13px;border-bottom:1px solid rgba(255,255,255,0.12)\">\n          <div style=\"font:800 14px Montserrat,sans-serif;color:#1A1F5C;background:#fff;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none\">08<\u002Fdiv>\n          <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px\">Conclusion<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:9px 14px\">\n          <div style=\"display:flex;gap:8px\">\n            <div style=\"flex:1;background:rgba(255,255,255,0.08);border-radius:8px;padding:8px 6px;text-align:center\">\n              <div style=\"font:700 9px Montserrat,sans-serif;color:#9FB0E0;text-transform:uppercase;letter-spacing:0.8px\">Structure<\u002Fdiv>\n              <div style=\"font:700 13px Montserrat,sans-serif;color:#fff;margin-top:3px\">Data Vault 2.0<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;background:rgba(255,255,255,0.08);border-radius:8px;padding:8px 6px;text-align:center\">\n              <div style=\"font:700 9px Montserrat,sans-serif;color:#9FB0E0;text-transform:uppercase;letter-spacing:0.8px\">Analytics<\u002Fdiv>\n              <div style=\"font:700 13px Montserrat,sans-serif;color:#fff;margin-top:3px\">Lakehouse / Delta<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:8px;background:rgba(46,124,214,0.20);border:1px solid rgba(46,124,214,0.45);border-radius:8px;padding:8px 11px;font:600 11px 'Source Sans 3',sans-serif;color:#fff;line-height:1.34\"><span style=\"font:700 9px Montserrat,sans-serif;color:#9FC0EA;text-transform:uppercase;letter-spacing:0.8px\">Combined &nbsp;<\u002Fspan> exists in practice (DV2.0 on the Lakehouse), but <b>used ahead of the research that would prove it<\u002Fb>.<\u002Fdiv>\n          <div style=\"margin-top:8px;font:400 11px 'Source Sans 3',sans-serif;color:#C7D0EC;line-height:1.4\"><b style=\"color:#fff\">Future work —<\u002Fb> test Data Vault 2.0 on an open table format against both criteria sets, turning a common practice into a <b style=\"color:#fff\">measured<\u002Fb> result.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- ============ KEY REFERENCES (full-width band) ============ -->\n  <div style=\"flex:none;margin:0 44px 8px;background:#F4F6FB;border:1px solid #E7EBF5;border-radius:10px;display:flex;align-items:stretch;overflow:hidden\">\n    <div style=\"flex:none;width:128px;background:#5A6472;display:flex;flex-direction:column;justify-content:center;padding:9px 16px\">\n      <div style=\"font:700 15px Montserrat,sans-serif;color:#fff;letter-spacing:0.3px;line-height:1.05\">Key<br>References<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;padding:9px 18px;column-count:5;column-gap:22px;font:400 9px 'Source Sans 3',sans-serif;color:#5A6472;line-height:1.3\">\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Linstedt, D. &amp; Olschimke, M. (2015). <i>Building a Scalable Data Warehouse with Data Vault 2.0.<\u002Fi> Morgan Kaufmann.<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Inmon, W. H. (2005). <i>Building the Data Warehouse<\u002Fi> (4th ed.). Wiley.<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Kimball, R. &amp; Ross, M. (2013). <i>The Data Warehouse Toolkit<\u002Fi> (3rd ed.). Wiley.<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Armbrust, M. et al. (2021). Lakehouse: A New Generation of Open Platforms. <i>CIDR 2021.<\u002Fi><\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Armbrust, M. et al. (2020). Delta Lake: High-Performance ACID Table Storage. <i>PVLDB, 13<\u002Fi>(12).<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Harby, A. A. &amp; Zulkernine, F. (2024). Data Lakehouse: A Survey &amp; Experimental Study. <i>Information Systems, 127.<\u002Fi><\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Schneider, J. et al. (2024). The Lakehouse: State of the Art. <i>SN Computer Science, 5<\u002Fi>(5).<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Nambiar, A. &amp; Mundra, D. (2022). An Overview of Data Warehouse and Data Lake. <i>BDCC, 6<\u002Fi>(4).<\u002Fdiv>\n      <div style=\"break-inside:avoid;margin-bottom:6px\">Giebler, C. et al. (2019). Modeling Data Lakes with Data Vault. <i>ER 2019,<\u002Fi> LNCS 11788.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ FOOTER ============ -->\n  <div style=\"flex:none;background:#1A1F5C;padding:8px 44px;display:flex;align-items:center;justify-content:center\">\n    <div style=\"font:400 11px 'Source Sans 3',sans-serif;color:#AEBBE6;text-align:center\">Databricks (2022) and other vendor reference architectures are used as <b style=\"color:#fff\">industry sources (not peer-reviewed)<\u002Fb> and flagged as such throughout.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:2245,&quot;height&quot;:1588}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
